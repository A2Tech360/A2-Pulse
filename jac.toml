[project]
name = "empty"
version = "0.0.1"
description = "Empty Jac project - start from scratch"
entry-point = "main.jac"
kind = "web-app"

[byllm]
# The model is chosen at startup from LLM_MODEL in .env (see .env.example and
# services/pulse_llm.jac). No provider or model is hard-coded; the provider's
# own key env var (OPENAI_API_KEY, ANTHROPIC_API_KEY, GEMINI_API_KEY, ...) is
# read by LiteLLM directly. "mockllm" is byLLM's built-in null model: every
# Jac module resolves the ambient `llm` on import and an empty name raises when
# no key is set, so it only fills the slot while the LLM is off.
# LLM_API_KEY (one key for any provider) and LLM_API_BASE (an OpenAI-compatible
# gateway) apply to the ambient model too; empty means "use the provider's own
# key env var" and "provider's default endpoint".
[byllm.model]
default_model = "${LLM_MODEL:-mockllm}"
api_key = "${LLM_API_KEY:-}"
base_url = "${LLM_API_BASE:-}"


[jac-shadcn]
style = "nova"
baseColor = "stone"
theme = "neutral"
font = "geist"
radius = "medium"
menuAccent = "subtle"
menuColor = "default"
